# Alerting rules. State is visible in Grafana → Alerting → Alert rules and on
# the "Platform Overview" dashboard (panel "Firing alerts").
#
# Check syntax:  make check-monitoring
groups:
  - name: availability
    rules:
      - alert: ScrapeTargetDown
        expr: up{job!="probe"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for 1 minute."

      - alert: ServiceProbeFailed
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} does not answer its health check"
          description: "HTTP probe of {{ $labels.instance }} has been failing for 1 minute."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "postgres-exporter cannot connect to the database."

  - name: backend
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_server_duration_milliseconds_count{job="ft-backend", http_status_code=~"5.."}[5m]))
            /
          sum(rate(http_server_duration_milliseconds_count{job="ft-backend"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend 5xx rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests failed over the last 5 minutes."

      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_duration_milliseconds_bucket{job="ft-backend"}[5m]))
          ) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency above 1s"
          description: "p95 is {{ $value | humanize }} ms over the last 5 minutes."

      # Utilization, not the delay histogram: with the SDK's 5 s sampling
      # resolution nodejs_eventloop_delay_* sits at ~5 s even when idle.
      - alert: BackendEventLoopSaturated
        expr: nodejs_eventloop_utilization_ratio{job="ft-backend"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js event loop is saturated"
          description: "The backend event loop is {{ $value | humanizePercentage }} busy — requests are queueing."

  - name: database
    rules:
      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of the connection limit is in use."

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 90%"
          description: "Average CPU usage is {{ $value | humanizePercentage }} for 10 minutes."

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory almost exhausted"
          description: "Only {{ $value | humanizePercentage }} of memory is available."

      - alert: HostDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/etc/hosts"}
            / node_filesystem_size_bytes{mountpoint="/etc/hosts"} < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Docker host disk almost full"
          description: "Only {{ $value | humanizePercentage }} of disk space is left."

  - name: telemetry
    rules:
      - alert: TelemetryExportFailing
        expr: |
          sum(rate(otelcol_exporter_send_failed_spans[5m])) > 0
            or
          sum(rate(otelcol_exporter_send_failed_metric_points[5m])) > 0
            or
          sum(rate(otelcol_exporter_send_failed_log_records[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenTelemetry collector is dropping data"
          description: "The collector fails to export telemetry to Prometheus, Tempo or Loki."
