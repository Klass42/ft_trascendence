# Endpoints and listen ports come from .env.example via ${env:VAR}
# (OpenTelemetry Collector env expansion). Hostnames stay as compose service names.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${env:OTEL_GRPC_PORT}
      http:
        endpoint: 0.0.0.0:${env:OTEL_HTTP_PORT}

processors:
  batch:
    timeout: ${env:OTEL_BATCH_TIMEOUT}
    send_batch_size: ${env:OTEL_BATCH_SIZE}
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_MEMORY_SPIKE_MIB}
  resource:
    attributes:
      - key: service.instance.id
        from_attribute: host.name
        action: upsert

exporters:
  prometheusremotewrite:
    endpoint: ${env:PROMETHEUS_REMOTE_WRITE_URL}
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/loki, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:${env:OTEL_METRICS_PORT}
