# Listen port MUST match params.env LOKI_PORT.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 72h

ingester:
  chunk_encoding: snappy

querier:
  max_concurrent: 4

# Accept OTLP logs directly
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - service.instance.id
      - deployment.environment
