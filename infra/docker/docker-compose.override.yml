# Override to use alternative host ports to avoid clashes

services:
  backend:
    ports:
      - "4100:3000"
    environment:
      - FRONTEND_URL=http://localhost:4110
      - JWT_ACCESS_SECRET=dev-not-secret
      - JWT_REFRESH_SECRET=dev-not-secret
  frontend:
    ports:
      - "4110:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:4100
  postgres:
    ports:
      - "4242:5432"
  prometheus:
    ports:
      - "4160:9090"
  otel-collector:
    ports:
      - "4162:4317"
      - "4163:4318"
      - "4164:8888"
  loki:
    ports:
      - "4165:3100"
  grafana:
    ports:
      - "4150:3000"


