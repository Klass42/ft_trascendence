# Optional overlay: bind extra host ports to avoid clashes / skip Caddy.
# NOT used by `make up` / `make all` (those pass only docker-compose.yml).
# Merge explicitly:
#   make up-direct
#   docker compose --env-file params.env -f docker-compose.yml -f docker-compose.override.yml up -d
#
# All values come from params.env (OVERRIDE_* and container ports).

services:
  backend:
    ports:
      - "${OVERRIDE_BACKEND_HOST_PORT}:${BACKEND_PORT}"
    environment:
      FRONTEND_URL: ${OVERRIDE_FRONTEND_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  frontend:
    ports:
      - "${OVERRIDE_FRONTEND_HOST_PORT}:5173"
    environment:
      VITE_BACKEND_URL: ${OVERRIDE_VITE_BACKEND_URL}
  postgres:
    ports:
      - "${OVERRIDE_POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
  prometheus:
    ports:
      - "${OVERRIDE_PROMETHEUS_HOST_PORT}:${PROMETHEUS_PORT}"
  otel-collector:
    ports:
      - "${OVERRIDE_OTEL_GRPC_HOST_PORT}:${OTEL_GRPC_PORT}"
      - "${OVERRIDE_OTEL_HTTP_HOST_PORT}:${OTEL_HTTP_PORT}"
      - "${OVERRIDE_OTEL_METRICS_HOST_PORT}:${OTEL_METRICS_PORT}"
  loki:
    ports:
      - "${OVERRIDE_LOKI_HOST_PORT}:${LOKI_PORT}"
  grafana:
    ports:
      - "${OVERRIDE_GRAFANA_HOST_PORT}:${GRAFANA_PORT}"
