# ft_trascendence - Development Stack
# Usage: docker compose -f infra/docker/docker-compose.dev.yml up
#
# Ports:
#   Frontend:       http://localhost:5173
#   Backend:        http://localhost:3000
#   Grafana:        http://localhost:3001  (admin/admin)
#   Prometheus:     http://localhost:9090
#   Tempo:          http://localhost:3200
#   Loki:           http://localhost:3100
#   OTel Collector: http://localhost:4318 (HTTP) / localhost:4317 (gRPC)

services:
  # ─── Application ─────────────────────────────────────────
  backend:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm --filter @ft-trascendence/backend exec prisma generate &&
             pnpm --filter @ft-trascendence/backend exec prisma db push --skip-generate &&
             pnpm --filter @ft-trascendence/backend run dev"
    volumes:
      - ../../:/app
      - backend_node_modules:/app/node_modules
      - backend_app_node_modules:/app/apps/backend/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://ft:ft@postgres:5432/ft_dev?schema=public
      # JWT secrets for Epic 1+ — dev-only non-secret placeholders (AGENTS.md §7).
      # Ale: tighten before any staging/prod deploy.
      - JWT_ACCESS_SECRET=dev-not-secret-replace-me
      - JWT_REFRESH_SECRET=dev-not-secret-replace-me
      # Google OAuth (Epic 3) — dev defaults.
      - FRONTEND_URL=http://localhost:5173
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=ft-backend
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ft-trascendence/frontend run dev"
    volumes:
      - ../../:/app
      - frontend_node_modules:/app/node_modules
      - frontend_app_node_modules:/app/apps/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ─── Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ft
      - POSTGRES_PASSWORD=ft
      - POSTGRES_DB=ft_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ft -d ft_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ─── Observability ───────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../monitoring/otel-collector/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.54.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--enable-feature=native-histograms'
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "9095:9095"   # Tempo gRPC
    networks:
      - app-network

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceQLStreaming,metricsSummary
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app-network

volumes:
  backend_node_modules:
  backend_app_node_modules:
  frontend_node_modules:
  frontend_app_node_modules:
  postgres_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
