# ft_trascendence — Docker Compose
# Single-command deploy:  make up   (or docker compose -f infra/docker/docker-compose.yml up -d --build)
#
# All external connections via Caddy (HTTPS). HTTP → HTTPS redirect on :80.
# Monitoring services NOT exposed directly — only via Caddy TLS multi-port.
#
# URLs:
#   App:              https://localhost
#   Grafana:          https://localhost:3001   (admin / set in .env)
#   Prometheus:       https://localhost:9090
#   Tempo:             https://localhost:3200
#   Loki:              https://localhost:3100
#
# Prisma migrations run automatically on backend startup (prisma migrate deploy).

services:
  # ─── HTTPS / Reverse Proxy ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"
      - "9090:9090"
      - "3200:3200"
      - "3100:3100"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  # ─── Application ─────────────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD:-ft}@postgres:5432/${POSTGRES_DB:-ft_prod}?schema=public
      # JWT secrets — dev defaults. Replace for staging/prod.
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-not-secret-replace-me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-not-secret-replace-me}
      # Google OAuth — empty = disabled
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://localhost/auth/google/callback}
      # Frontend URL (CORS / OAuth redirect)
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
      # Object storage (Garage / S3)
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_REGION=${S3_REGION:-garage}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-change-me}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-change-me}
      - S3_BUCKET=${S3_BUCKET:-ft-uploads}
      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=ft-backend
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ─── Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ft}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ft}
      - POSTGRES_DB=${POSTGRES_DB:-ft_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ft} -d ${POSTGRES_DB:-ft_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ─── Observability ───────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../monitoring/otel-collector/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.54.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--enable-feature=native-histograms'
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - app-network

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceQLStreaming,metricsSummary
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app-network

volumes:
  postgres_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge