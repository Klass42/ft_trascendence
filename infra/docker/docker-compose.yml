# ft_trascendence — Docker Compose
# Single-command deploy:  make up
#
# All interpolation comes from infra/docker/params.env (passed via --env-file).
# Optional local overrides: infra/docker/.env (gitignored, last file wins).
#
# All external connections via Caddy (HTTPS). HTTP → HTTPS redirect.
# Monitoring is NOT exposed directly — only via Caddy TLS multi-port.
#
# Public URLs are defined in params.env (APP_URL, GRAFANA_URL, …).

name: ${COMPOSE_PROJECT_NAME}

services:
  # ─── HTTPS / Reverse Proxy ───────────────────────────────
  caddy:
    image: ${CADDY_IMAGE}
    ports:
      - "${CADDY_HTTP_PORT}:${CADDY_HTTP_PORT}"
      - "${CADDY_HTTPS_PORT}:${CADDY_HTTPS_PORT}"
      - "${GRAFANA_HOST_PORT}:${GRAFANA_HOST_PORT}"
      - "${PROMETHEUS_HOST_PORT}:${PROMETHEUS_HOST_PORT}"
      - "${TEMPO_HOST_PORT}:${TEMPO_HOST_PORT}"
      - "${LOKI_HOST_PORT}:${LOKI_HOST_PORT}"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - params.env
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT}
      APP_URL: ${APP_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
      GRAFANA_HOST_PORT: ${GRAFANA_HOST_PORT}
      GRAFANA_PORT: ${GRAFANA_PORT}
      PROMETHEUS_HOST_PORT: ${PROMETHEUS_HOST_PORT}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT}
      TEMPO_HOST_PORT: ${TEMPO_HOST_PORT}
      TEMPO_PORT: ${TEMPO_PORT}
      LOKI_HOST_PORT: ${LOKI_HOST_PORT}
      LOKI_PORT: ${LOKI_PORT}
      BACKEND_HOST: ${BACKEND_HOST}
      FRONTEND_HOST: ${FRONTEND_HOST}
      GRAFANA_HOST: ${GRAFANA_HOST}
      PROMETHEUS_HOST: ${PROMETHEUS_HOST}
      TEMPO_HOST: ${TEMPO_HOST}
      LOKI_HOST: ${LOKI_HOST}
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  # ─── Application ─────────────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOY_ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "${BACKEND_HEALTH_URL}"]
      interval: ${BACKEND_HEALTH_INTERVAL}
      timeout: ${BACKEND_HEALTH_TIMEOUT}
      retries: ${BACKEND_HEALTH_RETRIES}
    networks:
      - app-network

  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        BACKEND_HOST: ${BACKEND_HOST}
        BACKEND_PORT: ${BACKEND_PORT}
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
      NGINX_ENVSUBST_FILTER: BACKEND_HOST|BACKEND_PORT|FRONTEND_PORT
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ─── Database ────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${POSTGRES_HEALTH_INTERVAL}
      timeout: ${POSTGRES_HEALTH_TIMEOUT}
      retries: ${POSTGRES_HEALTH_RETRIES}
    networks:
      - app-network

  # ─── Observability ───────────────────────────────────────
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otel-collector.yaml"]
    environment:
      OTEL_GRPC_PORT: ${OTEL_GRPC_PORT}
      OTEL_HTTP_PORT: ${OTEL_HTTP_PORT}
      OTEL_METRICS_PORT: ${OTEL_METRICS_PORT}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT}
      LOKI_OTLP_ENDPOINT: ${LOKI_OTLP_ENDPOINT}
      OTEL_BATCH_TIMEOUT: ${OTEL_BATCH_TIMEOUT}
      OTEL_BATCH_SIZE: ${OTEL_BATCH_SIZE}
      OTEL_MEMORY_LIMIT_MIB: ${OTEL_MEMORY_LIMIT_MIB}
      OTEL_MEMORY_SPIKE_MIB: ${OTEL_MEMORY_SPIKE_MIB}
    volumes:
      - ../monitoring/otel-collector/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app-network

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--enable-feature=native-histograms'
      - '--web.listen-address=0.0.0.0:${PROMETHEUS_PORT}'
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network

  tempo:
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - app-network

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - app-network

  grafana:
    image: ${GRAFANA_IMAGE}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}
      GF_FEATURE_TOGGLES_ENABLE: ${GF_FEATURE_TOGGLES_ENABLE}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT}
      PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL}
      TEMPO_URL: ${GRAFANA_TEMPO_URL}
      LOKI_URL: ${GRAFANA_LOKI_URL}
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app-network

volumes:
  postgres_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
