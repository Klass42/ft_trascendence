name: CI

on:
  push:
    branches: [master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linters, Prisma schema, build and unit tests — the same script as `make ci`.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm is enabled through corepack in scripts/ci.sh; the built-in
          # cache would look for it before it exists.
          package-manager-cache: false

      - name: Install linters (actionlint, yamllint, hadolint)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q yamllint
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin actionlint
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint, build and test
        run: bash scripts/ci.sh

  # The mandatory gate: the stack must come up from a clean clone with one
  # command and serve the app over HTTPS.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose, Caddyfile and Prometheus rules
        run: make check

      - name: Deploy with a single command
        run: make

      - name: Smoke test through the HTTPS proxy
        run: bash scripts/smoke.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm is enabled through corepack in the next step; the built-in
          # cache would look for it before it exists.
          package-manager-cache: false

      - name: Browser smoke test (Playwright, zero console errors)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter @ft-trascendence/frontend
          pnpm --filter @ft-trascendence/frontend exec playwright install --with-deps chromium
          pnpm --filter @ft-trascendence/frontend run test:e2e:compose

      - name: Service state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 200
