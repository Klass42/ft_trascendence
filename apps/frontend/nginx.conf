# Static file server for the built SPA. Only reachable from Caddy on the
# compose network — no TLS, no proxying, no compression here (Caddy does it).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed files here: safe to cache forever, and a
    # missing one must be a real 404, not index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html, which must be
    # revalidated so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
